---
# Resolve the ".." in dotfiles_dir so link sources are canonical and existing
# symlinks compare equal on re-runs.
- name: Normalise dotfiles root
  ansible.builtin.set_fact:
    dotfiles_root: "{{ dotfiles_dir | realpath }}"

- name: Ensure ~/.config exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config"
    state: directory
    mode: "0755"

- name: Ensure ~/.local/bin exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
    state: directory
    mode: "0755"

- name: Symlink home-level dotfiles
  ansible.builtin.file:
    src: "{{ dotfiles_root }}/{{ item.src }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "gitconfig/.gitconfig", dest: ".gitconfig" }
    - { src: "tmux/.tmux.conf", dest: ".tmux.conf" }
    - { src: "zsh/.zshrc", dest: ".zshrc" }
    - { src: "zsh/.fzf.zsh", dest: ".fzf.zsh" }
    - { src: "zsh/.p10k.zsh", dest: ".p10k.zsh" }

# skhd and yabai keep their configs under a nested .config/<app>/ path, so the
# link source is not just the top-level package dir the way it is for nvim.
- name: Symlink ~/.config apps
  ansible.builtin.file:
    src: "{{ dotfiles_root }}/{{ item.src }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "nvim", dest: "nvim" }
    - { src: "skhd/.config/skhd", dest: "skhd" }
    - { src: "yabai/.config/yabai", dest: "yabai" }

- name: Symlink scripts into ~/.local/bin
  ansible.builtin.file:
    src: "{{ dotfiles_root }}/local/{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - cht.sh
    - tmux-sessionizer

# On Apple Silicon, /usr/bin/git is a universal binary. If the parent process
# runs under Rosetta (as cmux and some other sandboxes do), the kernel picks
# git's x86_64 slice, which then tries to dlopen libxcrun.dylib for Xcode
# Command Line Tools - a library Apple now ships arm64-only. That fails with
# "unable to load libxcrun" even though a working git is right there.
# ~/.local/bin is earlier on PATH than /usr/bin, so pointing git straight at
# the arm64-only CLT binary (no x86_64 slice to mistakenly prefer) sidesteps
# the broken trampoline entirely.
- name: Symlink arm64 git into ~/.local/bin to bypass the broken xcrun trampoline under Rosetta
  ansible.builtin.file:
    src: /Library/Developer/CommandLineTools/usr/bin/git
    dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/git"
    state: link
    force: true
