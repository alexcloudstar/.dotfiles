---
# ---------- nvm + node ----------
- name: Check for nvm
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.nvm/nvm.sh"
  register: nvm_stat

- name: Install nvm
  ansible.builtin.shell: |
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_version }}/install.sh | bash
  args:
    executable: /bin/bash
  when: not nvm_stat.stat.exists

- name: Install node ({{ node_version }}) via nvm
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm install {{ node_version }}
    nvm alias default {{ node_version }}
  args:
    executable: /bin/bash
  register: nvm_install
  changed_when: "'is already installed' not in nvm_install.stdout"

- name: Install global npm packages
  ansible.builtin.shell: |
    export NVM_DIR="$HOME/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm use default >/dev/null
    npm install -g {{ item }}
  args:
    executable: /bin/bash
  loop: "{{ npm_global_packages }}"
  register: npm_install
  changed_when: "'up to date' not in npm_install.stdout"

# ---------- bun ----------
- name: Check for bun
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.bun/bin/bun"
  register: bun_stat

- name: Install bun
  ansible.builtin.shell: |
    curl -fsSL https://bun.sh/install | bash
  args:
    executable: /bin/bash
  when: not bun_stat.stat.exists

# ---------- rustup ----------
- name: Check for rustup
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup"
  register: rustup_stat

- name: Install rustup
  ansible.builtin.shell: |
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain {{ rustup_toolchain }} --default-host aarch64-apple-darwin
  args:
    executable: /bin/bash
  when: not rustup_stat.stat.exists

# An rustup installed under Rosetta is an x86_64 binary and cannot install
# aarch64 toolchains. Replace it with the native one, keeping existing toolchains.
- name: Check rustup binary architecture
  ansible.builtin.command: "/usr/bin/file -b {{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup"
  register: rustup_file
  changed_when: false
  check_mode: false
  when: rustup_stat.stat.exists

- name: Reinstall rustup natively (aarch64)
  ansible.builtin.shell: |
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none --default-host aarch64-apple-darwin
    {{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup set default-host aarch64-apple-darwin
  args:
    executable: /bin/bash
  when:
    - rustup_stat.stat.exists
    - "'x86_64' in (rustup_file.stdout | default(''))"
    - "'arm64' not in (rustup_file.stdout | default(''))"

- name: Ensure rust toolchain is up to date
  ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup update {{ rustup_toolchain }}"
  register: rustup_update
  changed_when: "'unchanged' not in rustup_update.stdout"

# Read-only query, safe in check mode. The install and default tasks below
# are skipped in check mode because the command module does not support it.
- name: Read installed rust toolchains
  ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup toolchain list"
  register: rustup_toolchains
  changed_when: false
  check_mode: false
  when: rustup_stat.stat.exists

- name: Check whether the default rust toolchain is x86_64
  ansible.builtin.set_fact:
    rust_default_is_x86: "{{ (rustup_toolchains.stdout_lines | default([])) | select('search', 'default') | select('search', 'x86_64-apple-darwin') | list | length > 0 }}"

- name: Install native aarch64 rust toolchain
  ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup toolchain install {{ rust_native_toolchain }}"
  when:
    - rust_default_is_x86
    - rust_native_toolchain not in (rustup_toolchains.stdout | default(''))

# The x86_64 toolchain is left installed. Remove it by hand once the native one works.
- name: Set native aarch64 rust toolchain as default
  ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.cargo/bin/rustup default {{ rust_native_toolchain }}"
  when: rust_default_is_x86
