---
- name: Tap third-party Homebrew repos
  community.general.homebrew_tap:
    name: "{{ item }}"
    path: "{{ brew_bin | dirname }}"
    state: present
  loop: "{{ homebrew_taps }}"

# Brew ignores formulae from untrusted taps, so trust only the ones we install.
- name: Trust third-party tap formulae
  ansible.builtin.command: "{{ brew_bin }} trust --formula {{ homebrew_trusted_formulae | join(' ') }}"
  register: brew_trust
  changed_when: "'Already trusted' not in brew_trust.stdout"
  when: homebrew_trusted_formulae | length > 0

- name: Install Homebrew formulae
  community.general.homebrew:
    name: "{{ homebrew_formulae }}"
    path: "{{ brew_bin | dirname }}"
    state: present

# The docker-desktop cask links docker-compose here with sudo, which fails without a tty.
- name: Create Docker CLI plugins directory
  ansible.builtin.file:
    path: /usr/local/cli-plugins
    state: directory
    mode: "0755"
  become: true

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ homebrew_casks }}"
    path: "{{ brew_bin | dirname }}"
    state: present
    accept_external_apps: true

# The role tag (packages) is applied to every task here, `never` included, so
# `--tags packages` would pull these in. The `when` keeps them upkeep-only.
- name: Upgrade Homebrew formulae and casks
  community.general.homebrew:
    upgrade_all: true
    path: "{{ brew_bin | dirname }}"
  tags: [never, upkeep]
  when: "'upkeep' in ansible_run_tags"

- name: Remove old Homebrew downloads and versions
  ansible.builtin.command: "{{ brew_bin }} cleanup"
  changed_when: true
  tags: [never, upkeep]
  when: "'upkeep' in ansible_run_tags"
