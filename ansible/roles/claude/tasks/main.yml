---
# Resolve the ".." in dotfiles_dir so link sources are canonical and existing
# symlinks compare equal on re-runs.
- name: Normalise dotfiles root
  ansible.builtin.set_fact:
    dotfiles_root: "{{ dotfiles_dir | realpath }}"

- name: Ensure Claude Code directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ ansible_facts['env']['HOME'] }}/.claude"
    - "{{ ansible_facts['env']['HOME'] }}/.claude/plugins"
    - "{{ ansible_facts['env']['HOME'] }}/.agents"

- name: Symlink Claude Code config files
  ansible.builtin.file:
    src: "{{ dotfiles_root }}/claude/{{ item.src }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "CLAUDE.md", dest: ".claude/CLAUDE.md" }
    - { src: "settings.json", dest: ".claude/settings.json" }
    - { src: "plugins/installed_plugins.json", dest: ".claude/plugins/installed_plugins.json" }
    - { src: "guides", dest: ".claude/guides" }
    - { src: "mods", dest: ".claude/mods" }
    - { src: "skills", dest: ".claude/skills" }
    - { src: "skills", dest: ".agents/skills" }

# ~/.claude/hooks is a real directory (other tools drop files into it), so
# link each hook script instead of the whole directory.
- name: Ensure ~/.claude/hooks exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/hooks"
    state: directory
    mode: "0755"

- name: Symlink Claude Code hook scripts
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/hooks/{{ item | basename }}"
    state: link
    force: true
  with_fileglob:
    - "{{ dotfiles_root }}/claude/hooks/*.sh"
