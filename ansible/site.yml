---
- name: Bootstrap macOS workstation
  hosts: localhost
  gather_facts: true
  vars:
    dotfiles_dir: "{{ playbook_dir }}/.."
    brew_bin: /opt/homebrew/bin/brew
  pre_tasks:
    - name: Fail if not macOS
      ansible.builtin.fail:
        msg: "This playbook only supports macOS."
      when: ansible_facts['os_family'] != 'Darwin'

    - name: Fail if running under Rosetta on Apple Silicon
      ansible.builtin.fail:
        msg: "Running under Rosetta (x86_64). Open a native arm64 terminal and rerun."
      when:
        - ansible_facts['os_family'] == 'Darwin'
        - ansible_facts['architecture'] != 'arm64'
  roles:
    - role: homebrew
      tags: [homebrew]
    - role: packages
      tags: [packages]
    - role: shell
      tags: [shell]
    - role: languages
      tags: [languages]
    - role: symlinks
      tags: [symlinks]
    - role: claude
      tags: [claude]
